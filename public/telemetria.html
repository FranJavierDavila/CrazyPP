<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRAZY PING PONG · Telemetría (D1)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:#0b0e14; color:#e6ebf2; }
  header { padding:18px 22px; border-bottom:1px solid #1c2230; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:19px; margin:0; letter-spacing:.5px; }
  header h1 b { color:#fbbf24; }
  .pill { font-size:12px; padding:3px 10px; border-radius:999px; background:#13203a; color:#7ec8ff; border:1px solid #24406b; }
  .zonas { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input, button { font:inherit; }
  input[type=password], input[type=text] { background:#101623; border:1px solid #2a3550; color:#e6ebf2; border-radius:9px; padding:7px 11px; min-width:230px; }
  button { background:#1c7ed6; color:#fff; border:0; border-radius:9px; padding:8px 15px; cursor:pointer; font-weight:700; }
  button.sec { background:#243050; }
  button.rojo { background:#a03028; }
  button:disabled { opacity:.5; cursor:default; }
  main { padding:18px 22px; max-width:1180px; margin:0 auto; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin:14px 0; }
  .kpi { background:#101623; border:1px solid #1e2740; border-radius:14px; padding:14px 16px; }
  .kpi .n { font-size:26px; font-weight:900; color:#fbbf24; }
  .kpi .t { font-size:12px; color:#8b98ad; margin-top:3px; letter-spacing:.4px; text-transform:uppercase; }
  section { background:#0f1522; border:1px solid #1c2438; border-radius:14px; padding:16px 18px; margin:14px 0; }
  section h2 { font-size:14px; margin:0 0 10px; color:#9fb3cc; text-transform:uppercase; letter-spacing:.8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #1a2234; }
  th { color:#7e8ea6; font-weight:600; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .barras { display:flex; align-items:flex-end; gap:3px; height:64px; }
  .bar { flex:1; background:linear-gradient(180deg,#2f7dd1,#1b4f8f); border-radius:3px 3px 0 0; position:relative; min-height:2px; }
  .bar:hover::after { content:attr(data-l); position:absolute; bottom:-22px; left:50%; transform:translateX(-50%); font-size:10px; color:#9fb3cc; white-space:nowrap; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:820px){ .grid2 { grid-template-columns:1fr; } }
  .vacio { color:#5d6b82; font-size:13px; padding:8px 0; }
  .aviso { background:#2b1c10; border:1px solid #6b4413; color:#ffd257; padding:10px 14px; border-radius:12px; font-size:13px; margin:12px 0; }
  code { background:#182034; padding:1px 6px; border-radius:6px; font-size:12px; }
  .meta { color:#5d6b82; font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>🏓 CRAZY <b>PING PONG</b> · Telemetría</h1>
  <span class="pill">Producción · Cloudflare D1</span>
  <div class="zonas">
    <input id="clave" type="password" placeholder="clave de lectura (CLAVE del worker)">
    <button id="cargar">Ver datos</button>
    <button id="refresca" class="sec" disabled>Refrescar</button>
    <button id="purga" class="rojo" disabled>Purgar todo</button>
  </div>
</header>
<main>
  <div id="aviso" class="aviso" style="display:none"></div>
  <div id="contenido">
    <div class="vacio">Introduce la <b>CLAVE</b> del worker (la guarda el dueño; vive sólo en tu navegador) y pulsa «Ver datos».</div>
  </div>
  <p class="meta">Fuente: <code id="fuente">worker /api/tele</code> · el panel lee agregados y crudos con tu clave · sin cookies · sin IP.</p>
</main>
<script>
const DEF = 'https://crazypp-tele.escala3dcorreoia.workers.dev/api/tele';
const $ = (id) => document.getElementById(id);
let CLAVE = '';
try { CLAVE = localStorage.getItem('pp_tele_clave') || ''; } catch (e) {}
if (CLAVE) $('clave').value = CLAVE;

function base() {
  let u = '';
  try { u = localStorage.getItem('pp_tele_url') || ''; } catch (e) {}
  return (u || DEF).replace(/\/+$/, '');
}
function aviso(txt) { const a = $('aviso'); a.style.display = txt ? '' : 'none'; a.textContent = txt || ''; }
async function pide(q) {
  const r = await fetch(base() + q + (q.includes('?') ? '&' : '?') + 'clave=' + encodeURIComponent(CLAVE));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
const fnum = (n) => (n == null ? '—' : Number(n).toLocaleString('es-ES'));
const fms = (n) => (n == null ? '—' : n >= 1000 ? (n / 1000).toFixed(1) + ' s' : Math.round(n) + ' ms');

function kpi(n, t) { return '<div class="kpi"><div class="n">' + n + '</div><div class="t">' + t + '</div></div>'; }
function tabla(cabs, filas) {
  if (!filas.length) return '<div class="vacio">sin datos todavía</div>';
  return '<table><tr>' + cabs.map((c) => '<th>' + c + '</th>').join('') + '</tr>' +
    filas.map((f) => '<tr>' + f.map((v, i) => '<td' + (i ? ' class="num"' : '') + '>' + v + '</td>').join('') + '</tr>').join('') + '</table>';
}

function pinta(d) {
  const ev = d.porEvento || {};
  const evFilas = Object.entries(ev).sort((a, b) => b[1] - a[1]).map(([k, v]) => [k, fnum(v)]);
  const dur = d.duraciones || {};
  const vr = d.vrDuracion || {};
  const dias = (d.porDia || []).slice(-30);
  const maxD = Math.max(1, ...dias.map((x) => x.eventos || 0));
  const barras = '<div class="barras">' + dias.map((x) =>
    '<div class="bar" data-l="' + (x.dia || '') + ' · ' + fnum(x.eventos) + ' ev · ' + fnum(x.boots) + ' boots" style="height:' + Math.max(2, Math.round((x.eventos || 0) / maxD * 100)) + '%"></div>').join('') + '</div>';
  // porCampeonato llega como dict {champ: {evento: n}} (ronda 9)
  const pc = d.porCampeonato || {};
  const pcEsDict = !Array.isArray(pc);
  const pcFilas = pcEsDict
    ? Object.entries(pc).map(([ch, evs]) => [ch, Object.entries(evs || {}).map(([e, n]) => e + ' ' + fnum(n)).join(' · ') || '—'])
    : pc.map((c) => [c.champ || c.id || '—', fnum(c.n ?? c.jugadas), fnum(c.jugadores ?? '—')]);
  const ult = d.ultimos || [];
  const ultFilas = (Array.isArray(ult) ? ult : []).slice(0, 15).map((e) => [
    (e.e || '?'), (e.v || '—'), new Date(e.t || 0).toLocaleTimeString('es-ES'),
    '<span style="color:#8b98ad">' + String(e.json || '').replace(/[<>&]/g, '').slice(0, 90) + '</span>',
  ]);
  $('contenido').innerHTML =
    '<div class="kpis">' +
    kpi(fnum(d.total), 'eventos totales') +
    kpi(fnum(d.sesionesUnicas), 'sesiones únicas') +
    kpi(fnum(d.arranques24h), 'arranques 24 h') +
    kpi(fms(dur.max), 'permanencia máx.') +
    kpi(fms(dur.media), 'permanencia media') +
    kpi(fms(vr.media), 'en VR (media)') +
    '</div>' +
    '<section><h2>Eventos por día (30 d)</h2>' + (dias.length ? barras : '<div class="vacio">sin datos</div>') + '</section>' +
    '<div class="grid2">' +
    '<section><h2>Por evento</h2>' + tabla(['evento', 'n'], evFilas) + '</section>' +
    '<section><h2>Versiones</h2>' + tabla(['versión', 'eventos', 'sesiones'], (d.versiones || []).map((v) => [v.v || '—', fnum(v.eventos), fnum(v.sesiones)])) +
    '<h2 style="margin-top:14px">Campeonatos</h2>' + tabla(['champ', 'eventos'], pcFilas) + '</section>' +
    '</div>' +
    '<section><h2>Sesiones recientes</h2>' + tabla(['sid', 'eventos', 'primero', 'último'], (d.sesiones || []).slice(0, 12).map((s) => [s.sid, fnum(s.n), new Date(s.primero).toLocaleString('es-ES'), new Date(s.ultimo).toLocaleTimeString('es-ES')])) + '</section>' +
    '<section><h2>Últimos eventos (crudos)</h2>' + tabla(['evento', 'versión', 'hora', 'detalle'], ultFilas) + '</section>';
}

async function cargar() {
  CLAVE = $('clave').value.trim();
  if (!CLAVE) { aviso('Falta la CLAVE de lectura (variable CLAVE del worker).'); return; }
  try { localStorage.setItem('pp_tele_clave', CLAVE); } catch (e) {}
  aviso('');
  $('cargar').disabled = true; $('cargar').textContent = 'Cargando…';
  try {
    const d = await pide('?resumen=1');
    pinta(d);
    $('refresca').disabled = false; $('purga').disabled = false;
    $('fuente').textContent = base();
  } catch (e) {
    aviso('No se pudo leer (' + e.message + '). ¿Clave correcta? ¿Worker vivo? Prueba: ' + base() + '?resumen=1&clave=…');
  } finally {
    $('cargar').disabled = false; $('cargar').textContent = 'Ver datos';
  }
}
$('cargar').onclick = cargar;
$('refresca').onclick = cargar;
$('purga').onclick = async () => {
  if (!confirm('¿Borrar TODOS los eventos de telemetría?')) return;
  try { await fetch(base() + '?clave=' + encodeURIComponent(CLAVE), { method: 'DELETE' }); cargar(); }
  catch (e) { aviso('La purga falló: ' + e.message); }
};
if (CLAVE) cargar();
</script>
</body>
</html>
