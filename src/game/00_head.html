<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CRAZY PING PONG · Meta Quest 3</title>
<!-- r109 · M3 PWA: manifest + color del tema (instalable, adiós ?v=) -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0b2050" />
<meta name="description" content="Tenis de mesa arcade en WebXR para Meta Quest 3: partido, entrenamiento, supervivencia y multijugador online P2P." />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #050810; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e9edf2; }
  /* r151 · fade-in del canvas: sin portada, el 3D (el salón) aparece cuando
     el boot termina — evita el flash del court en los primeros frames */
  #c { position: fixed; inset: 0; display: block; pointer-events: none;
    opacity: 0; transition: opacity 0.6s ease; }
  #c.listo { opacity: 1; }

  /* ================= v2.28 · PORTADA ANIMADA ================= */
  /* ============ r151 · PORTADA RETIRADA — EL SALÓN ES LA ENTRADA ============
     El overlay deja de ser una portada opaca y pasa a HUD mínimo transparente
     sobre el 3D (el Hall del usuario). Los controles (botón VR, idiomas, pie)
     re-activan el puntero; el resto deja ver el salón vivo detrás. */
  #overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    transition: opacity 0.45s ease;
    pointer-events: none;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay button, #overlay a, #overlay select { pointer-events: auto; }
  .bgblur, .rays, .bball, .star, .hero-wrap { display: none !important; }

  /* arte de fondo difuminado (Ken Burns lento) */
  .bgblur {
    position: absolute; inset: -90px; z-index: 0;
    background-image: url("assets/externos/portada.jpg");
    background-size: cover; background-position: center 38%;
    filter: blur(16px) brightness(0.42) saturate(1.25);
    animation: kenburns 30s ease-in-out infinite alternate;
  }
  @keyframes kenburns {
    from { transform: scale(1.06) translate(-1.2%, -1%); }
    to   { transform: scale(1.22) translate(1.4%, 1.6%); }
  }
  /* haces de luz de pabellón barriendo el fondo */
  .rays {
    position: absolute; top: -30%; height: 170%; width: 34vw; z-index: 0;
    background: linear-gradient(90deg, transparent 6%, rgba(96,166,255,0.13) 50%, transparent 94%);
    transform: rotate(14deg); filter: blur(3px);
    animation: sweep 10s ease-in-out infinite alternate;
  }
  .rays.r1 { left: 8vw; }
  .rays.r2 { right: 8vw; transform: rotate(-15deg); animation-delay: -4.5s; animation-duration: 12s; }
  @keyframes sweep {
    from { opacity: 0.25; transform: rotate(11deg) translateX(-4vw); }
    to   { opacity: 0.8;  transform: rotate(17deg) translateX(5vw); }
  }
  /* bolas flotantes que cruzan la escena */
  .bball {
    position: absolute; z-index: 1; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #ffffff 0%, #e8ecf2 55%, #b9c2cf 100%);
    box-shadow: 0 0 22px rgba(255,255,255,0.55);
    animation: flyball linear infinite;
  }
  .bball.b1 { width: 26px; height: 26px; top: 62%; animation-duration: 9.5s; }
  .bball.b2 { width: 15px; height: 15px; top: 24%; animation-duration: 13s; animation-delay: -6s; opacity: 0.85; }
  .bball.b3 { width: 11px; height: 11px; top: 78%; animation-duration: 16s; animation-delay: -3s; opacity: 0.6; }
  @keyframes flyball {
    0%   { transform: translate(-8vw, 6vh); opacity: 0; }
    8%   { opacity: 1; }
    50%  { transform: translate(46vw, -9vh); }
    92%  { opacity: 1; }
    100% { transform: translate(108vw, 5vh); opacity: 0; }
  }
  /* estrellitas doradas titilando */
  .star { position: absolute; z-index: 1; width: 7px; height: 7px; border-radius: 50%;
    background: #ffd257; box-shadow: 0 0 10px #ffd257; animation: twinkle 3.2s ease-in-out infinite; }
  .star.s1 { left: 12%; top: 18%; } .star.s2 { left: 85%; top: 26%; animation-delay: -1.1s; }
  .star.s3 { left: 22%; top: 74%; animation-delay: -2s; } .star.s4 { left: 76%; top: 70%; animation-delay: -0.6s; }
  .star.s5 { left: 50%; top: 12%; animation-delay: -2.6s; } .star.s6 { left: 38%; top: 86%; animation-delay: -1.7s; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.7); }
    50% { opacity: 0.95; transform: scale(1.25); }
  }

  .stage { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    width: 100%; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    max-height: 52vh; overflow-y: auto;
    background: linear-gradient(180deg, rgba(5,8,16,0) 0%, rgba(5,8,16,0.45) 38%, rgba(5,8,16,0.82) 100%); }

  /* cabecera: arte oficial del juego flotando */
  .hero-wrap { animation: heroFloat 6s ease-in-out infinite; }
  .hero-wrap img {
    display: block; width: min(680px, 90vw); border-radius: 26px;
    border: 2px solid rgba(232, 180, 90, 0.45);
    box-shadow: 0 30px 90px rgba(2, 8, 24, 0.75), 0 0 46px rgba(59, 130, 246, 0.35);
    animation: heroGlow 6s ease-in-out infinite;
  }
  @keyframes heroFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }
  @keyframes heroGlow {
    0%, 100% { box-shadow: 0 30px 90px rgba(2, 8, 24, 0.75), 0 0 46px rgba(59, 130, 246, 0.35); }
    50% { box-shadow: 0 30px 90px rgba(2, 8, 24, 0.75), 0 0 70px rgba(96, 166, 255, 0.55); }
  }

  /* selector de idioma: dos palas compactas arriba a la derecha (r151) */
  .padrow { position: fixed; top: 12px; right: 14px; z-index: 25;
    display: flex; gap: 8px; }
  .padbtn {
    display: flex; flex-direction: row; align-items: center; gap: 6px;
    background: rgba(5,10,20,0.55); border: 1px solid rgba(255,255,255,0.22);
    border-radius: 14px; padding: 5px 9px; cursor: pointer;
    transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s, background 0.18s;
    backdrop-filter: blur(6px);
  }
  .padbtn img { width: 30px; height: 30px; object-fit: contain;
    filter: drop-shadow(0 3px 7px rgba(0,0,0,0.55)); }
  @keyframes padBob {
    0%, 100% { transform: rotate(-5deg) translateY(0); }
    50% { transform: rotate(5deg) translateY(-4px); }
  }
  .padbtn .padlbl { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; color: #b9c4d0; }
  .padbtn:hover { transform: translateY(-4px); border-color: rgba(232,180,90,0.55); }
  .padbtn.active {
    border-color: #e8b45a; background: rgba(232, 180, 90, 0.12);
    box-shadow: 0 0 26px rgba(232, 180, 90, 0.35);
  }
  .padbtn.active .padlbl { color: #ffd257; }
  .padbtn.active img { filter: drop-shadow(0 0 16px rgba(232,180,90,0.65)) drop-shadow(0 6px 14px rgba(0,0,0,0.55)); }

  /* gran botón cartoon JUGAR / PLAY EN VR — compacto sobre el salón (r151) */
  #vrbtn { background: none; border: none; cursor: pointer; margin-top: 0; }
  #vrbtn img {
    display: block; width: min(220px, 52vw);
    filter: drop-shadow(0 14px 26px rgba(0,0,0,0.6));
    animation: playPulse 1.9s ease-in-out infinite, playWiggle 4.8s ease-in-out infinite;
    transition: transform 0.18s;
  }
  #vrbtn:hover img { transform: scale(1.1); }
  #vrbtn:active img { transform: scale(0.97); }
  @keyframes playPulse {
    0%, 100% { filter: drop-shadow(0 14px 26px rgba(0,0,0,0.6)) drop-shadow(0 0 12px rgba(232,180,90,0.25)); }
    50% { filter: drop-shadow(0 14px 26px rgba(0,0,0,0.6)) drop-shadow(0 0 34px rgba(232,180,90,0.6)); }
  }
  @keyframes playWiggle {
    0%, 84%, 100% { rotate: 0deg; }
    88% { rotate: -2.4deg; }
    92% { rotate: 2.2deg; }
    96% { rotate: -1.2deg; }
  }

  #status { font-size: 12px; color: #b9c4d0; min-height: 16px; text-align: center;
    max-width: 720px; line-height: 1.4; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
  .footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 5px 8px; font-size: 12px; color: #9aa7b4;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
  .footlink {
    background: none; border: none; cursor: pointer; font-size: 12px; color: #8fd3e8;
    text-decoration: underline dotted; padding: 2px 4px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
  }
  .footlink:hover { color: #b7e7f5; }
  .footlink:disabled { color: #5c6672; text-decoration: none; cursor: not-allowed; }
  .dot { color: #4a5560; }

  #mutebtn {
    position: fixed; left: 14px; top: 12px; z-index: 30;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.28);
    font-size: 20px; cursor: pointer; transition: all 0.15s;
  }
  #mutebtn:hover { background: rgba(255,255,255,0.16); }
  #mutebtn.off { opacity: 0.55; }

  /* r151 · pantallas estrechas: el pie respira y el botón no invade el salón */
  @media (max-width: 640px) {
    .footer { font-size: 11px; }
    .footlink { font-size: 11px; }
    #vrbtn img { width: min(190px, 62vw); }
    .stage { gap: 5px; }
  }

  /* r152 · aviso «toca para entrar» (?vr=1 / ?ar=1 desde la LANDING-portada):
     el listener está en window — el aviso es pointer-events:none para no
     robar un solo toque al lienzo; en escritorio sin WebXR queda en rojo
     con el mensaje de enterVR */
  #tapvr {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 24; pointer-events: none; white-space: nowrap;
    max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
    font-size: clamp(13px, 2.6vw, 18px); font-weight: 800; letter-spacing: .12em;
    color: #ffd257; text-shadow: 0 2px 10px rgba(0,0,0,0.85);
    background: rgba(5,10,20,0.62); border: 1px solid rgba(255,210,87,0.45);
    border-radius: 999px; padding: 14px 26px; backdrop-filter: blur(8px);
    animation: tapPulse 1.6s ease-in-out infinite;
  }
  #tapvr.mal { color: #ff7a7a; border-color: rgba(255,122,122,0.5); animation: none; }
  @keyframes tapPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.05); }
  }


  /* v2.47/2.58 · botón INTRO de la portada + visor del vídeo (v2.58: el
     vídeo se reproduce CON SONIDO; la música principal se pausa mientras
     dura el vídeo y vuelve al cerrarlo) */
  #introbtn {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.26);
    border-radius: 999px; padding: 7px 18px; cursor: pointer;
    font-size: 13px; font-weight: 800; letter-spacing: 2px; color: #ffd257;
    transition: transform 0.15s, border-color 0.15s, background 0.15s, box-shadow 0.15s;
  }
  #introbtn:hover {
    transform: translateY(-2px); border-color: rgba(232, 180, 90, 0.6);
    background: rgba(232, 180, 90, 0.14); box-shadow: 0 0 22px rgba(232, 180, 90, 0.3);
  }
  #introov {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center; background: rgba(2, 4, 10, 0.94);
  }
  #introov.open { display: flex; }
  #introvid {
    max-width: 96vw; max-height: 90vh; border-radius: 18px; background: #000;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.8);
  }
  #introclose {
    position: absolute; top: 14px; right: 18px; width: 46px; height: 46px;
    border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.08); color: #e9edf2; font-size: 20px; cursor: pointer;
  }
  #introclose:hover { background: rgba(255, 255, 255, 0.18); }
  #introhint {
    position: absolute; bottom: 16px; left: 0; right: 0; text-align: center;
    color: #8d9aa8; font-size: 13px; letter-spacing: 1.5px;
  }

  /* v2.68 · RANKING MUNDIAL en la portada 2D (antes de entrar en VR):
     botón del pie + panel flotante con desplegable por campeonato y la
     tabla top 10 (nombre · puntos · logros). Misma familia visual que
     el visor de INTRO: panel oscuro, borde dorado, botones pill. */
  #wrlbtn {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(232, 180, 90, 0.1); border: 1px solid rgba(232, 180, 90, 0.45);
    border-radius: 999px; padding: 7px 18px; cursor: pointer;
    font-size: 13px; font-weight: 800; letter-spacing: 2px; color: #ffd257;
    transition: transform 0.15s, border-color 0.15s, background 0.15s, box-shadow 0.15s;
  }
  #wrlbtn:hover {
    transform: translateY(-2px); border-color: rgba(232, 180, 90, 0.75);
    background: rgba(232, 180, 90, 0.2); box-shadow: 0 0 22px rgba(232, 180, 90, 0.35);
  }
  #wrlov {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center; background: rgba(2, 4, 10, 0.9);
  }
  #wrlov.open { display: flex; }
  .wrlpanel {
    width: min(560px, 94vw); max-height: 88vh; overflow-y: auto;
    background: linear-gradient(180deg, #10141d 0%, #0a0d14 100%);
    border: 2px solid rgba(232, 180, 90, 0.6); border-radius: 22px;
    box-shadow: 0 30px 90px rgba(2, 8, 24, 0.8), 0 0 40px rgba(232, 180, 90, 0.12);
    padding: 20px 22px 18px; position: relative;
  }
  .wrlhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .wrltitle { font-size: 19px; font-weight: 900; letter-spacing: 2.5px; color: #ffd257; }
  #wrlclose {
    width: 38px; height: 38px; border-radius: 50%; flex: 0 0 auto;
    border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.08);
    color: #e9edf2; font-size: 17px; cursor: pointer;
  }
  #wrlclose:hover { background: rgba(255, 255, 255, 0.18); }
  .wrlrow { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  #wrlsel {
    flex: 1 1 auto; min-width: 0; appearance: none; -webkit-appearance: none;
    background: rgba(255, 255, 255, 0.06) url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='9'%3E%3Cpath d='M1 1l6 6 6-6' fill='none' stroke='%23e8b45a' stroke-width='2'/%3E%3C/svg%3E") no-repeat right 14px center;
    border: 1px solid rgba(232, 180, 90, 0.5); border-radius: 12px;
    color: #f2f4f6; font-size: 14.5px; font-weight: 700; padding: 10px 38px 10px 14px; cursor: pointer;
  }
  #wrlsel option { background: #10141d; color: #f2f4f6; }
  #wrlref {
    flex: 0 0 auto; background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.26); border-radius: 12px;
    color: #ffd257; font-size: 13px; font-weight: 800; padding: 10px 14px; cursor: pointer;
  }
  #wrlref:hover { background: rgba(232, 180, 90, 0.16); border-color: rgba(232, 180, 90, 0.6); }
  #wrlstat { font-size: 12.5px; margin-top: 10px; color: #8d9aa8; min-height: 16px; }
  .wrlgrid { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .wrlgrid th {
    font-size: 11.5px; letter-spacing: 1.6px; color: #75828f; font-weight: 800;
    text-align: left; padding: 7px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.14);
  }
  .wrlgrid th:nth-child(3), .wrlgrid td:nth-child(3) { text-align: right; }
  .wrlgrid th:nth-child(4), .wrlgrid td:nth-child(4) { text-align: right; }
  .wrlgrid td {
    font-size: 14px; color: #e6ebf0; padding: 9px 8px; font-weight: 600;
    border-bottom: 1px dashed rgba(255, 255, 255, 0.08); white-space: nowrap;
  }
  .wrlgrid tr.me td { color: #ffd257; }
  .wrlgrid .meTag {
    display: inline-block; margin-left: 7px; font-size: 10px; font-weight: 900;
    letter-spacing: 1.2px; color: #10131a; background: #e8b45a;
    border-radius: 6px; padding: 2px 6px; vertical-align: 1px;
  }
  .wrlnone { text-align: center !important; color: #5c6672 !important; padding: 18px 8px !important; }
  .wrlogro { width: 30px; height: 30px; object-fit: contain; vertical-align: middle; filter: drop-shadow(0 0 4px rgba(255,210,87,0.65)); }
  .wrlfoot { margin-top: 12px; font-size: 12px; color: #75828f; line-height: 1.5; }

  /* ==== r109 · M3 PWA: toast de instalación en la portada + botón vivo ==== */
  #ppToast {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(8px);
    max-width: min(560px, 86vw); z-index: 60;
    background: rgba(9, 14, 26, 0.94); border: 1px solid rgba(255, 210, 87, 0.55);
    border-radius: 14px; padding: 12px 18px;
    color: #e9edf2; font-size: 14px; line-height: 1.55; text-align: center;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.55);
    opacity: 0; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease;
  }
  #ppToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #ppToast b { color: #ffd257; }
  .footlink.pwaOn { color: #ffd257; font-weight: 700; text-shadow: 0 0 8px rgba(255,210,87,0.45); }
</style>
